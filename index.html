<style>
:root{--bg:#f4f6f8;--fg:#14202b;--card:#fff;--line:#d5dce3;--blue:#1e88e5;--green:#43a047;--red:#e53935;--accent:#0288d1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--fg:#e8eef3;--card:#1a2530;--line:#2c3a47}}
:root[data-theme="dark"]{--bg:#0f1720;--fg:#e8eef3;--card:#1a2530;--line:#2c3a47}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;padding:12px;max-width:560px;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
h1{font-size:20px;margin:4px 0 8px}
.sel{font-size:18px;font-weight:700;margin:6px 0}
.grid{display:grid;gap:6px;margin-bottom:6px}
.g6{grid-template-columns:repeat(6,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.b{padding:11px 0;border:0;border-radius:8px;font-size:16px;color:#fff}
.n{background:var(--blue)}.m{background:var(--green)}.b.on{background:var(--red)}
.seg{display:flex;gap:6px;align-items:center;margin:10px 0}
.seg span{font-size:14px}
.seg button{flex:1;padding:10px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--fg);font-size:16px}
.seg button.on{border-color:var(--accent);background:var(--accent);color:#fff}
#shoot{width:100%;padding:18px;font-size:22px;font-weight:700;border:0;border-radius:12px;background:var(--accent);color:#fff}
#shoot:disabled{opacity:.4}
#msg{min-height:22px;margin:6px 0;font-size:14px}
.head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 6px}
.head b{flex:1;min-width:140px}
input[type=date],.head button{padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:15px}
.row{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;margin-bottom:6px}
.row img{width:56px;height:56px;object-fit:cover;border-radius:6px}
.row .t{flex:1}
.row button{padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.row .red{color:var(--red);border-color:var(--red)}
.note{font-size:12px;opacity:.75;margin-top:10px}
</style>
</head>
<body>
<h1>ナイフチェック</h1>
<div class="sel" id="sel"></div>
<div class="grid g6" id="nums"></div>
<div class="grid g4" id="names"></div>
<div class="seg" id="q"><span>画質</span>
<button data-q="low">低</button><button data-q="mid">中</button><button data-q="high">高</button></div>
<button id="shoot" disabled>撮影</button>
<input id="file" type="file" accept="image/*" capture="environment" hidden>
<div id="msg"></div>
<div class="head"><b id="cnt"></b><input type="date" id="day"><button id="all">まとめて保存</button></div>
<div id="list"></div>
<p class="note">写真はこの端末のブラウザ内に、日付ごとに保存されます。ブラウザの都合で消えることがあるため、毎日「まとめて保存」で写真やファイルに残してください。ピント合わせやズームは、起動するカメラの画面で行います。</p>
<script>
const $=id=>document.getElementById(id);
const NUMS=Array.from({length:18},(_,i)=>'No.'+(i+1));
const NAMES=['父','母','匠','心','優','里奈','智幸巴','舞'];
const Q={low:[1600,.8],mid:[2800,.9],high:[4000,.95]};
let sel=null,q='mid',db=null,taken=new Set(),cur=[],urls=[];
try{q=localStorage.getItem('q')||'mid'}catch(e){}
const p=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
const hms=d=>`${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
const msg=t=>{$('msg').textContent=t};

function openDb(){return new Promise((ok,ng)=>{const r=indexedDB.open('knife',1);
 r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id',autoIncrement:true}).createIndex('day','day');
 r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)})}
const tx=(m,f)=>new Promise((ok,ng)=>{const t=db.transaction('p',m);const o=f(t.objectStore('p'));
 t.oncomplete=()=>ok(o&&o.result);t.onerror=()=>ng(t.error)});
const byDay=d=>tx('readonly',s=>s.index('day').getAll(d));

function mk(box,arr,cls){arr.forEach(l=>{const b=document.createElement('button');
 b.className='b '+cls;b.dataset.l=l;b.onclick=()=>{sel=l;paint()};box.appendChild(b)})}
function paint(){
 document.querySelectorAll('.b').forEach(b=>{const l=b.dataset.l;b.classList.toggle('on',l===sel);
  b.textContent=(taken.has(l)?'✓':'')+(l.startsWith('No.')?l.slice(3):l)});
 $('sel').textContent=sel?`選択中: ${sel}`:'↓ 包丁を選んでください';
 $('shoot').disabled=!sel;
 document.querySelectorAll('#q button').forEach(b=>b.classList.toggle('on',b.dataset.q===q));
}

function loadImg(f){return new Promise((ok,ng)=>{const u=URL.createObjectURL(f),i=new Image();
 i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=()=>ng(new Error('画像を読み込めません'));i.src=u})}

function stamp(x,w,h,text){
 const fs=Math.round(w*.05),m=Math.round(w*.03),pad=Math.round(fs*.3);
 x.font=`bold ${fs}px system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif`;
 x.textBaseline='top';
 const tw=x.measureText(text).width,bh=fs+pad*2;
 x.fillStyle='rgba(0,0,0,.67)';x.fillRect(m,h-m-bh,tw+pad*2,bh);
 x.fillStyle='#fff';x.fillText(text,m+pad,h-m-bh+pad);
}

$('shoot').onclick=()=>{if(sel){$('file').value='';$('file').click()}};
$('file').onchange=async()=>{
 const f=$('file').files[0];if(!f)return;
 if(!db){msg('この端末では保存できません');return}
 msg('処理中…');
 try{
  const img=await loadImg(f),[mx,qq]=Q[q];
  const s=Math.min(1,mx/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s);
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
  const now=new Date(),label=sel;
  stamp(x,w,h,`${label}  ${ymd(now).replace(/-/g,'/')} ${p(now.getHours())}:${p(now.getMinutes())}`);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',qq));
  await tx('readwrite',st=>st.add({day:ymd(now),label,time:hms(now),ts:+now,blob}));
  msg(`保存しました: ${label} (${w}×${h})`);
  $('day').value=ymd(now);render();
 }catch(e){msg('失敗しました: '+e.message)}
};

async function render(){
 if(!db)return;
 const today=ymd(new Date()),day=$('day').value||today;
 const rows=(await byDay(day)).sort((a,b)=>b.ts-a.ts);
 taken=new Set((day===today?rows:await byDay(today)).map(r=>r.label));paint();
 urls.forEach(u=>URL.revokeObjectURL(u));urls=[];cur=rows;
 $('cnt').textContent=`${day} の撮影 ${rows.length}枚`;$('list').innerHTML='';
 rows.forEach(r=>{const u=URL.createObjectURL(r.blob);urls.push(u);
  const d=document.createElement('div');d.className='row';
  d.innerHTML=`<img src="${u}" alt=""><div class="t"><b>${r.label}</b><br>${r.time.replace(/(..)(..)(..)/,'$1:$2:$3')}</div><button data-s="${r.id}">保存</button><button class="red" data-d="${r.id}">削除</button>`;
  $('list').appendChild(d)});
}

async function save(recs){
 if(!recs.length)return;
 const files=recs.map(r=>new File([r.blob],`${r.day.replace(/-/g,'')}_${r.time}_${r.label.replace('.','')}.jpg`,{type:'image/jpeg'}));
 try{if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files});return}}
 catch(e){if(e.name==='AbortError')return}
 files.forEach((f,i)=>setTimeout(()=>{const a=document.createElement('a');
  a.href=URL.createObjectURL(f);a.download=f.name;a.click()},i*400));
}

$('list').onclick=async e=>{const t=e.target;
 if(t.dataset.s)save(cur.filter(r=>String(r.id)===t.dataset.s));
 if(t.dataset.d){
  if(t.dataset.arm){await tx('readwrite',st=>st.delete(+t.dataset.d));render()}
  else{t.dataset.arm='1';t.textContent='本当に削除';
   setTimeout(()=>{delete t.dataset.arm;t.textContent='削除'},3000)}}
};
$('all').onclick=()=>save(cur);
$('day').onchange=render;
document.querySelectorAll('#q button').forEach(b=>b.onclick=()=>{
 q=b.dataset.q;try{localStorage.setItem('q',q)}catch(e){}paint()});

mk($('nums'),NUMS,'n');mk($('names'),NAMES,'m');
$('day').value=ymd(new Date());paint();
openDb().then(d=>{db=d;render();
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}})
 .catch(()=>msg('この端末では保存できません(プライベートブラウズをやめてください)'));
</script>
